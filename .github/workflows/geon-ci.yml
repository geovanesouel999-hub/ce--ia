name: GEON CI

on:
  push:
    paths:
      - "GEON/**"
      - ".github/workflows/geon-ci.yml"
  pull_request:
    paths:
      - "GEON/**"
      - ".github/workflows/geon-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GEON
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GEON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
